name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Cache buster (каждый деплой = свежая версия app.js/style.css без CDN-кэша)
        run: |
          V=$(echo "$GITHUB_SHA" | cut -c1-7)
          sed -i "s/app.js?v=[0-9a-f]*/app.js?v=$V/; s/style.css?v=[0-9a-f]*/style.css?v=$V/" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
